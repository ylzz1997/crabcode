[package]
name = "crabcode-computer-use-core"
version = "0.1.7"
edition = "2021"
description = "CrabCode native Computer Use engine shared by all clients"

[dependencies]
base64 = "0.22"
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
foreign-types = "0.5"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_UI_Shell",
] }

[dev-dependencies]
url = "2"
