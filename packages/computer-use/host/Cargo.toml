[package]
name = "crabcode-computer-use-host"
version = "0.1.9"
edition = "2021"

[[bin]]
name = "crabcode-computer-use-host"
path = "src/main.rs"

[dependencies]
crabcode-computer-use-core = { path = "../core" }
dirs = "6"
fs2 = "0.4"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
embed-resource = "3.0"
sha2 = "0.10"
