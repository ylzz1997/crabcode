[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crabcode-debugger"
# Synced from packages/core/crabcode_core/_version.py by scripts/sync_version.py.
version = "0.1.3"
description = "DAP and process-level debugging tools for CrabCode"
requires-python = ">=3.10"
dependencies = [
    "crabcode-core>=0.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["crabcode_debugger"]
