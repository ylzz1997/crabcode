[package]
name = "crabcode-desktop"
version = "0.1.7"
description = "Desktop client for CrabCode Gateway"
authors = ["CrabCode"]
edition = "2021"

[lib]
name = "crabcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crabcode-computer-use-core = { path = "../../computer-use/core" }
crabcode-computer-use-host = { path = "../../computer-use/host" }
dirs = "6"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tempfile = "3"
url = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
