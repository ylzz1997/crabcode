name: Document engine offline wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "packages/gateway/**"
      - "scripts/build_document_engine_bundle.py"
      - ".github/workflows/document-engine-wheels.yml"

jobs:
  offline-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build CrabCode wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Resolve platform wheelhouse
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse BabelDOC==0.6.4
          python -c "from pathlib import Path; import shutil; shutil.copy2(next(Path('dist').glob('crabcode-*.whl')), 'wheelhouse')"
      - name: Verify fully offline installation
        shell: bash
        run: |
          python -m venv engine-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then PYTHON=engine-venv/Scripts/python.exe; else PYTHON=engine-venv/bin/python; fi
          "$PYTHON" -m pip install --no-index --find-links wheelhouse BabelDOC==0.6.4
          "$PYTHON" -m pip install --no-index --no-deps --find-links wheelhouse crabcode
          "$PYTHON" -c "import babeldoc; import crabcode_gateway.document_worker"
